# Минимальный несекретный конфиг swarm-инстанса.
# По умолчанию runtime читает именно config/settings.toml.
# Стабильные пути вроде data/history.db и ai/prompts/* задаются кодом и здесь не дублируются.

[gemini]
# Необязательный override основной модели.
model = "gemini-2.5-flash"

[logging]
# Необязательный override уровня логирования.
level = "INFO"

[swarm.schedule]
# UTC-окна, в которые разрешены плановые обмены между ботами.
active_windows_utc = ["10-11", "16-18"]
initiator_offset_minutes = [0, 30]
responder_delay_minutes = [3, 10]
max_turns_per_exchange = 2

[[groups]]
# Уникальный id группы внутри приложения.
id = "danang"

# Название города для prompt-контекста scheduled exchange.
city = "Da Nang"

# Если false, reply-router и orchestrator перестают обрабатывать группу.
enabled = true

# Достаточно указать group_chat_id или group_target. Можно оставить оба.
group_chat_id = -1001234567890
group_target = "@danang_group"

[[groups]]
id = "batumi"
city = "Batumi"
enabled = true
group_chat_id = -1009876543210
group_target = "@batumi_group"

# Необязательные override расписания только для этой группы.
[groups.schedule]
active_windows_utc = ["14-16"]
responder_delay_minutes = [5, 12]

[swarm.orchestrator]
tick_seconds = 30
silence_timeout_minutes = 60
skip_if_recent_human_activity = true

[[swarm.bots]]
id = "dmitry"
session_env = "SESSION_STRING_DMITRY"
persona_file = "dmitry.md"
enabled = true
temperature = 0.9

[[swarm.bots]]
id = "vitaly"
session_env = "SESSION_STRING_VITALY"
persona_file = "vitaly.md"
enabled = true
temperature = 0.8
