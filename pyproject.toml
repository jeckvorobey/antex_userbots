[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-userbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "python-socks[asyncio]>=2.5.3",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "pyasn1>=0.6.4",
    "urllib3>=2.7.0",
    "apscheduler>=3.10",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.14.2",
    "openrouter>=1.1.122,<2",
    "httpx[socks]>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "userbot*", "core*", "storage*"]

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.package-data]
ai = ["prompts/*.md", "prompts/*.toml", "prompts/bots/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
